[package]
name = "nopads_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game client for 7 on 7 No Pads Football"

[[bin]]
name = "7on7"
path = "src/main.rs"

[dependencies]
nopads_core = { path = "../core" }
nopads_render = { path = "../render" }
nopads_platform = { path = "../platform", default-features = false }
# The desktop window. Android has no X11, Wayland or Win32 to open, so the
# crate is not even built there: the surface stands in for it.
[target.'cfg(not(target_os = "android"))'.dependencies]
minifb = "0.29.0"
# Optional second window backend. Off by default: the minifb window has no GPU
# requirement, so most builds should not pay for this.
bevy = { version = "0.20", default-features = false, features = [
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_asset",
  "bevy_log",
  "x11",
  "multi_threaded",
], optional = true }

# The Android front end needs the activity's window and its input queue. Only
# built for that target: nowhere else has either.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"

[features]
# Gamepad support. On by default so `cargo run -- arcade` just works; build with
# --no-default-features where the platform has no controller stack (gilrs needs
# libudev on Linux).
default = ["gamepad"]
gamepad = ["nopads_platform/gamepad"]
# `7on7 arcade --bevy` draws the same canvas through a Bevy window.
bevy_view = ["dep:bevy"]

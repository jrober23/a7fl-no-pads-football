name: android

# The tag that publishes the Windows zip also publishes the APK, so one release
# carries both clients.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner's SDK has cmdline-tools but nothing on PATH, and the old
      # `setup-android` action wants a "tools" package that no longer exists.
      # Find the sdkmanager that is already there and install what we need.
      - name: Android SDK and NDK
        run: |
          sdkmanager_bin="$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -1)"
          sdk_root="$(cd "$(dirname "$sdkmanager_bin")/../../.." && pwd)"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Build the APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./android/build-apk.sh

      # The release is made by the Windows job; this waits for it so the APK lands
      # on the same release, and makes it itself if the Windows build failed.
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          for _ in $(seq 1 10); do
            gh release view "$tag" > /dev/null 2>&1 && break
            sleep 15
          done
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" target/android/*.apk --clobber
